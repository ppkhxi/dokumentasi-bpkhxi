name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Siapkan keystore dari secret
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Ambil versi dari index.html
        id: versi
        run: echo "nama=$(grep -oP "const VERSI = '\K[^']+" www/index.html)" >> "$GITHUB_OUTPUT"

      - name: Build APK release
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease -PversionCode=${{ github.run_number }} -PversionName=${{ steps.versi.outputs.nama }}

      - name: Salin APK ke folder Pages
        run: |
          mkdir -p www/dl
          cp android/app/build/outputs/apk/release/app-release.apk www/dl/dkpoint.apk

      - name: Commit APK ke main (Pages akan deploy otomatis)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add www/dl/dkpoint.apk
          git diff --cached --quiet || git commit -m "apk: dkpoint ${{ steps.versi.outputs.nama }} (build ${{ github.run_number }})"
          git push
