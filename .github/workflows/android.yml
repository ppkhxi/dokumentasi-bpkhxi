name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "www/**"
      - "!www/dl/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Siapkan keystore dari secret
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Secret ANDROID_KEYSTORE_B64 belum diisi"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Ambil versi dari index.html
        id: versi
        run: echo "nama=$(grep -oP "const VERSI = '\K[^']+" www/index.html)" >> "$GITHUB_OUTPUT"

      - name: Salin aplikasi web ke dalam APK (assets)
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -r www/. android/app/src/main/assets/
          rm -rf android/app/src/main/assets/dl

      - name: Build APK release
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease -PversionCode=${{ github.run_number }} -PversionName=${{ steps.versi.outputs.nama }}

      - name: Salin APK ke folder Pages
        run: |
          mkdir -p www/dl
          cp android/app/build/outputs/apk/release/app-release.apk www/dl/dkpoint.apk

      - name: Unggah APK sebagai artifact (bisa diunduh dari halaman run)
        uses: actions/upload-artifact@v4
        with:
          name: dkpoint-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Commit APK ke main (Pages akan deploy otomatis)
        env:
          VERSI_APK: ${{ steps.versi.outputs.nama }}
          NOMOR_BUILD: ${{ github.run_number }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/dkpoint.apk"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            mkdir -p www/dl
            cp "$RUNNER_TEMP/dkpoint.apk" www/dl/dkpoint.apk
            git add www/dl/dkpoint.apk
            if git diff --cached --quiet; then echo "APK sudah sama, tidak ada perubahan"; exit 0; fi
            git commit -q -m "apk: dkpoint ${VERSI_APK} (build ${NOMOR_BUILD})"
            if git push -q origin HEAD:main; then echo "APK terkirim"; exit 0; fi
            echo "Push ditolak, coba lagi ($i)..."
            sleep 5
          done
          echo "Gagal push APK setelah 5 kali coba"; exit 1
