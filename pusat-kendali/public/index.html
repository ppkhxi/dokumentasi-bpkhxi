<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pusat Kendali Platform</title>
  <meta name="description" content="Status GitHub, Supabase, Cloudflare, dan penyimpanan untuk setiap proyek.">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>Pusat Kendali Platform</h1>
      <nav class="switch" id="pilih-proyek" aria-label="Pilih proyek"></nav>
      <div class="top-r">
        <span class="waktu" id="waktu-ambil" aria-live="polite"></span>
        <button class="btn" id="muat-ulang" type="button">Muat ulang</button>
        <span class="akun" id="pengguna" hidden></span>
        <a class="btn" id="keluar" href="/cdn-cgi/access/logout">Keluar</a>
      </div>
    </header>

    <main id="isi" aria-live="polite">
      <p class="memuat">Memuat daftar proyek…</p>
    </main>

    <footer class="kaki">
      <span>Masuk lewat Cloudflare Access</span>
      <span>Data dari API GitHub, Supabase, dan Cloudflare · disimpan sementara 60 detik</span>
    </footer>
  </div>
  <script src="/app.js"></script>
</body>
</html>
