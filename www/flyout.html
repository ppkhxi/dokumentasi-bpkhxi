<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kamera cepat</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; height:100%; background:#0e100e; overflow:hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:#fff; }
  button { font-family:inherit; -webkit-tap-highlight-color:transparent; }
  .kartu { position:fixed; inset:0; display:flex; flex-direction:column; gap:8px; padding:10px;
    box-sizing:border-box; background:#121412; border-radius:26px; }
  .kepala { display:flex; align-items:center; gap:9px; min-height:34px; }
  .kepala img { width:26px; height:26px; border-radius:8px; object-fit:contain; background:#fff1; }
  .kepala .info { flex:1; min-width:0; font-size:11px; line-height:1.25; }
  .kepala .info b { display:block; font-size:13px; }
  .kepala .info span { color:#9fb0a4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
  .tbl { background:#232823; color:#fff; border:0; border-radius:50%; width:32px; height:32px; padding:0;
    display:flex; align-items:center; justify-content:center; font-size:14px; }
  .tbl svg { width:16px; height:16px; stroke:#fff; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; transition:transform .2s; }
  #panelBtn[aria-expanded="true"] svg { transform:rotate(180deg); }
  .panel { display:none; background:#1b1f1b; border-radius:16px; padding:9px 10px; font-size:12px; }
  .panel.buka { display:block; }
  .panel .baris { display:flex; align-items:center; gap:8px; }
  .panel .baris + .baris { margin-top:8px; }
  .panel label { width:58px; color:#9fb0a4; flex:0 0 auto; }
  .opsi { display:flex; gap:5px; flex:1; }
  .opsi button { flex:1; border:0; border-radius:10px; padding:7px 0; background:#262c26; color:#d6e0d9; font-size:12px; }
  .opsi button.pilih { background:#fff; color:#111; font-weight:700; }
  .pratinjau { position:relative; flex:1 1 auto; min-height:0; border-radius:16px; overflow:hidden; background:#000; }
  #video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #tirai { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #tirai.kilat { animation: kilat .18s ease-out; }
  @keyframes kilat { from { opacity:.85 } to { opacity:0 } }
  #hitung { position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:72px; font-weight:700;
    text-shadow:0 2px 12px #000a; pointer-events:none; }
  input#catatan { width:100%; box-sizing:border-box; border:0; border-radius:14px; padding:10px 12px;
    background:#1f241f; color:#fff; font-size:14px; outline:none; }
  input#catatan::placeholder { color:#7d8a80; }
  .kolomCatatan { position:relative; }
  .kolomCatatan input#catatan { padding-right:50px; }
  #mikrofon { position:absolute; right:6px; top:50%; transform:translateY(-50%); width:36px; height:36px;
    border-radius:50%; border:0; background:#2a2f2a; color:#fff; font-size:16px; line-height:36px; padding:0; }
  #mikrofon::before { content:''; display:block; width:14px; height:14px; margin:11px auto; border-radius:50%; background:#ef4444; }
  #mikrofon.aktif::before { border-radius:3px; animation:denyutMik 1s infinite; }
  #mikrofon.aktif { background:#2a2f2a; }
  @keyframes denyutMik { 50% { opacity:.55; } }
  .bawah { display:flex; justify-content:space-between; align-items:center; flex:0 0 auto; padding:2px 6px 0; }
  #mini { width:46px; height:46px; border-radius:14px; background:#232823 center/cover no-repeat; border:2px solid #2f352f; padding:0; }
  #ganti { width:46px; height:46px; border-radius:50%; background:#232823; border:0; padding:0; display:flex; align-items:center; justify-content:center; }
  #ganti svg { width:22px; height:22px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #rana { width:62px; height:62px; border-radius:50%; border:4px solid #121412; background:#fff;
    padding:0; box-shadow:0 0 0 3px #fff; }
  #rana:active { transform:scale(.93); }
  #rana:disabled { opacity:.5; }
  #cobaLagi { margin-top:10px; background:#fff; color:#111; border:0; border-radius:10px; padding:8px 14px; font-size:13px; font-weight:600; }
  #pesan { position:fixed; left:50%; bottom:92px; transform:translateX(-50%); background:rgba(0,0,0,.85);
    padding:6px 10px; border-radius:10px; font-size:12px; opacity:0; transition:opacity .2s; pointer-events:none;
    max-width:90%; text-align:center; }
  #pesan.tampil { opacity:1; }
  .kamera-native #video { display:none; }
  .kamera-native .pratinjau { background:transparent; }
  .kamera-native #tirai { display:none; }
  .kosong { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:16px; box-sizing:border-box; font-size:13px; color:#c9d3cb; }
</style>
</head>
<body>
<div class="kartu" role="dialog" aria-label="Kamera cepat">
  <div class="kepala">
    <img src="icons/logo-dokumentasi.png" alt="">
    <div class="info"><b>Dokumentasi</b><span id="info">—</span></div>
    <button id="panelBtn" class="tbl" type="button" aria-label="Pengaturan cepat" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <button id="tutup" class="tbl" type="button" aria-label="Tutup">&#10005;</button>
  </div>
  <div class="panel" id="panel">
    <div class="baris"><label>Timer</label><div class="opsi" id="opsiTimer">
      <button data-v="0" class="pilih">Mati</button><button data-v="3">3 dtk</button><button data-v="5">5 dtk</button><button data-v="10">10 dtk</button></div></div>
    <div class="baris"><label>Kualitas</label><div class="opsi" id="opsiMutu">
      <button data-v="300">Hemat</button><button data-v="500">Normal</button><button data-v="900">Tinggi</button></div></div>
  </div>
  <div class="pratinjau">
    <video id="video" playsinline muted autoplay></video>
    <div id="tirai"></div>
    <div id="hitung"></div>
    <div id="kosong" class="kosong" style="display:none"><div><div id="kosongTeks"></div><button id="cobaLagi" type="button">Coba lagi</button></div></div>
  </div>
  <div class="kolomCatatan">
    <input id="catatan" maxlength="250" placeholder="Tulis nomor patok atau catatan..." autocomplete="off">
    <button id="mikrofon" type="button" aria-label="Rekam catatan suara"></button>
  </div>
  <div class="bawah">
    <button id="mini" type="button" aria-label="Foto terakhir"></button>
    <button id="rana" type="button" aria-label="Ambil foto"></button>
    <button id="ganti" type="button" aria-label="Ganti kamera"><svg viewBox="0 0 24 24"><path d="M20 7h-3l-2-2H9L7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/><path d="M9 13a3 3 0 0 1 5-2l1 1M15 14a3 3 0 0 1-5 2l-1-1"/></svg></button>
  </div>
</div>
<div id="pesan" role="status" aria-live="polite"></div>

<script src="js/security.js"></script>
<script src="js/exif-gps.js"></script>
<script>
/* Kamera cepat untuk APK (ringan). Hanya kamera, catatan, dan rana.
   Foto disimpan ke penyimpanan yang sama dengan Galeri (IndexedDB bpkh_portal),
   berwatermark sama, dan diunggah pada jadwal 16.00 WIB seperti biasa.
   Logika penyimpanan & watermark sengaja disalin dari index.html; ubah keduanya bersamaan. */

const $ = id => document.getElementById(id);
const LOGO_BAWAAN = 'icons/logo-dokumentasi.png';
const DBNAMA = 'bpkh_portal', STORE = 'foto';

/* Mode APK: kamera dipegang aplikasi (CameraX), halaman ini hanya antarmuka, watermark, dan simpan. */
const KAMERA_ASLI = !!(window.DokumentasiNative && DokumentasiNative.jepretNative);
if (KAMERA_ASLI) document.documentElement.classList.add('kamera-native');

const S = {
  nama: '', userId: '', room: '', kantor: 'BPKH WILAYAH XI',
  targetKB: 500, lebarMax: 1600, logo: '', logoPilih: 'baru', logoImg: null,
  posisi: null, stream: null, orientasi: 0
};

function baca(k, bawaan) { try { const v = localStorage.getItem(k); return v === null ? bawaan : v; } catch (_) { return bawaan; } }
function muatPengaturan() {
  S.nama = baca('bpkh_nama', '');
  S.userId = baca('bpkh_userId', '');
  S.room = baca('bpkh_room', '');
  const k = baca('dkpoint_kantor', '') || baca('bpkh_kantor', '');
  S.kantor = (!k || k === 'dkpoint' || k === 'Portal Dokumentasi BPKH Wilayah XI') ? 'BPKH WILAYAH XI' : k;
  S.targetKB = +baca('bpkh_target', 500);
  S.lebarMax = +baca('bpkh_lebar', 1600);
  S.logo = baca('bpkh_logo', '');
  S.logoPilih = baca('bpkh_logo_pilih', 'baru') === 'lama' ? 'lama' : 'baru';
  const im = new Image();
  const sumber = (S.logoPilih === 'lama' && S.logo) ? S.logo : LOGO_BAWAAN;
  im.onload = () => S.logoImg = im;
  im.onerror = () => S.logoImg = null;
  im.src = sumber;
}

function pesan(t) {
  const el = $('pesan'); el.textContent = t; el.classList.add('tampil');
  clearTimeout(pesan._t); pesan._t = setTimeout(() => el.classList.remove('tampil'), 2200);
}

/* ---------- Penyimpanan (sama dengan index.html) ---------- */
function bukaDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DBNAMA, 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: 'id' });
      if (!d.objectStoreNames.contains('peta_kml')) d.createObjectStore('peta_kml', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('peta_raster')) d.createObjectStore('peta_raster', { keyPath: 'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function hitungFotoRoom(namaRoom) {
  const d = await bukaDB();
  return new Promise((res, rej) => {
    let n = 0;
    const req = d.transaction(STORE, 'readonly').objectStore(STORE).openCursor();
    req.onsuccess = () => {
      const c = req.result;
      if (!c) return res(n);
      if (((c.value.room || 'LOKAL').trim().toUpperCase()) === namaRoom.toUpperCase()) n++;
      c.continue();
    };
    req.onerror = () => rej(req.error);
  });
}
function salinKeGaleriHp(nama, dataUrl) {
  try {
    const N = window.DokumentasiNative;
    if (N && N.simpanKeGaleri && dataUrl) return !!N.simpanKeGaleri(nama, String(dataUrl).split(',')[1] || '');
  } catch (e) {}
  return false;
}
async function simpanFoto(rec) {
  const d = await bukaDB();
  return new Promise((res, rej) => {
    const t = d.transaction(STORE, 'readwrite');
    t.objectStore(STORE).put(rec);
    t.oncomplete = res;
    t.onerror = () => rej(t.error);
  });
}

/* Status upload: sama aturannya dengan MegaEngine.bisaUpload di aplikasi utama */
function bisaUploadRoom(namaRoom) {
  if (baca('dkpoint_mega_auth', '')) return true;
  let daftar = [];
  try { daftar = JSON.parse(baca('dkpoint_mega_rooms', '[]')) || []; } catch (_) {}
  const target = (namaRoom || '').trim().toUpperCase();
  const r = daftar.find(x => (x.nama || '').trim().toUpperCase() === target);
  return !!(r && (r.authTicket || r.tipe === 'host'));
}

/* ---------- Watermark (sama dengan index.html) ---------- */
const fmtKoord = p => p ? p.lat.toFixed(6) + ', ' + p.lon.toFixed(6) : 'Tidak tersedia';
const fmtWaktu = ts => new Date(ts).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

function gambarWatermark(ctx, W, H, rot = 0) {
  ctx.save();
  const pad = Math.round(Math.min(W, H) * 0.025);
  const fBesar = Math.max(13, Math.round(Math.min(W, H) * 0.032));
  const fKecil = Math.max(10, Math.round(Math.min(W, H) * 0.022));
  const lineH = Math.round(fKecil * 1.35);
  const mauTanggal = baca('dkpoint_tanggal_wm', 'true') !== 'false';
  const mauCatatan = baca('dkpoint_catatan_wm', 'false') === 'true';

  let jumlahBaris = 1;
  if (mauTanggal) jumlahBaris++;
  let catatanWm = '';
  if (mauCatatan) {
    const raw = $('catatan').value.trim();
    if (raw) { catatanWm = raw.length > 55 ? raw.substring(0, 52) + '...' : raw; jumlahBaris++; }
  }

  const tinggiContent = fBesar + lineH * jumlahBaris + pad * 0.8;
  const sisiLogo = Math.max(Math.round(tinggiContent * 0.72), 34);

  ctx.font = 'bold ' + fBesar + 'px Roboto, sans-serif';
  const wKantor = ctx.measureText(S.kantor || 'BPKH WILAYAH XI').width;
  ctx.font = fKecil + 'px Roboto, sans-serif';
  const wKoord = ctx.measureText('\u{1F4CD} ' + fmtKoord(posisiFoto())).width;
  const wWaktu = mauTanggal ? ctx.measureText(fmtWaktu(Date.now()) + ' WIB').width : 0;
  const wCatatan = catatanWm ? ctx.measureText(catatanWm).width : 0;

  const wTeksMax = Math.max(wKantor, wKoord, wWaktu, wCatatan);
  const boxW = Math.round(pad * 1.5 + sisiLogo + pad * 0.7 + wTeksMax + pad * 1.2);
  const boxH = Math.round(tinggiContent + pad * 0.8);

  if (rot === 90) { ctx.translate(W - pad - boxH, H - pad); ctx.rotate(-Math.PI / 2); }
  else if (rot === -90) { ctx.translate(pad + boxH, pad); ctx.rotate(Math.PI / 2); }
  else { ctx.translate(pad, H - boxH - pad); }

  ctx.fillStyle = 'rgba(0,0,0,0.68)';
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(0, 0, boxW, boxH, Math.round(pad * 0.7)); ctx.fill(); }
  else ctx.fillRect(0, 0, boxW, boxH);

  const xLogo = pad, yLogo = Math.round((boxH - sisiLogo) / 2);
  if (S.logoImg) {
    const r = Math.min(sisiLogo / S.logoImg.width, sisiLogo / S.logoImg.height);
    const w = S.logoImg.width * r, h = S.logoImg.height * r;
    ctx.drawImage(S.logoImg, xLogo + (sisiLogo - w) / 2, yLogo + (sisiLogo - h) / 2, w, h);
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(xLogo, yLogo, sisiLogo, sisiLogo);
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.font = 'bold ' + Math.round(sisiLogo * 0.22) + 'px Roboto, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('LOGO', xLogo + sisiLogo / 2, yLogo + sisiLogo / 2);
  }

  const xTeks = xLogo + sisiLogo + Math.round(pad * 0.7);
  let yTeks = Math.round(pad * 0.55);
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 3;

  ctx.font = 'bold ' + fBesar + 'px Roboto, sans-serif';
  ctx.fillText(S.kantor, xTeks, yTeks);
  yTeks += fBesar + Math.round(pad * 0.25);
  ctx.font = fKecil + 'px Roboto, sans-serif';
  ctx.fillText('\u{1F4CD} ' + fmtKoord(posisiFoto()), xTeks, yTeks);
  yTeks += lineH;
  if (mauTanggal) { ctx.fillText(fmtWaktu(Date.now()) + ' WIB', xTeks, yTeks); yTeks += lineH; }
  if (catatanWm) ctx.fillText(catatanWm, xTeks, yTeks);
  ctx.restore();
}

/* Orientasi dari screen.orientation, sama dengan aplikasi utama */
function sudutLayar() {
  if (KAMERA_ASLI) return 0;
  if (!screen.orientation) return 0;
  const tipe = screen.orientation.type || '';
  if (!tipe.startsWith('landscape')) return 0;
  return screen.orientation.angle === 270 ? -90 : 90;
}

/* ---------- Kamera ---------- */
async function bukaKamera() {
  $('kosong').style.display = 'none';
  if (KAMERA_ASLI) { kirimPosisiPratinjau(); return; }
  if (S.stream) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    tampilKosong('Kamera tidak didukung di perangkat ini.'); return;
  }
  try {
    S.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1440 } },
      audio: false
    });
    const v = $('video');
    v.srcObject = S.stream;
    /* Kalau sistem mematikan track kamera (misalnya direbut aplikasi lain), coba nyalakan lagi. */
    S.stream.getVideoTracks().forEach(tr => tr.onended = () => {
      if (!S.stream) return;
      S.stream = null;
      setTimeout(() => bukaKamera(), 800);
    });
    await v.play().catch(() => {});
  } catch (e) {
    console.error('Kamera flyout gagal:', e);
    S.stream = null;
    if (!bukaKamera.sudahUlang) {
      /* Sekali coba ulang otomatis: kamera kadang masih dipegang sesaat setelah dilepas. */
      bukaKamera.sudahUlang = true;
      setTimeout(bukaKamera, 1200);
      return;
    }
    tampilKosong('Kamera tidak bisa dibuka (' + (e && e.name ? e.name : 'error') + '). Izinkan akses kamera untuk aplikasi.');
  }
}
function tampilKosong(t) { $('kosongTeks').textContent = t; $('kosong').style.display = 'flex'; }
function hentikanKamera() {
  if (S.stream) { S.stream.getTracks().forEach(t => t.stop()); S.stream = null; }
  const v = $('video'); if (v) v.srcObject = null;
}
/* Dipanggil dari aplikasi (OverlayService) saat flyout ditutup */
function tutupFlyCapture() { hentikanKamera(); }

/* Potong tengah ke rasio 3:4, sama dengan kamera aplikasi utama */
function potongKeRasio(v) {
  const vw = v.videoWidth, vh = v.videoHeight;
  let sw, sh;
  if (vw / vh > 3 / 4) { sh = vh; sw = Math.round(vh * 3 / 4); }
  else { sw = vw; sh = Math.round(vw * 4 / 3); }
  const sx = Math.round((vw - sw) / 2), sy = Math.round((vh - sh) / 2);
  const kanvas = document.createElement('canvas');
  kanvas.width = sw; kanvas.height = sh;
  kanvas.getContext('2d').drawImage(v, sx, sy, sw, sh, 0, 0, sw, sh);
  return kanvas;
}

async function prosesFoto(sumber, wAsli, hAsli) {
  const rot = sudutLayar();
  const sk = Math.min(1, S.lebarMax / Math.max(wAsli, hAsli));
  const W = Math.round(wAsli * sk), H = Math.round(hAsli * sk);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.drawImage(sumber, 0, 0, W, H);
  gambarWatermark(ctx, W, H, rot);

  const keBlob = (cv, q) => new Promise(r => cv.toBlob(r, 'image/jpeg', q));
  let q = 0.85, blob = await keBlob(c, q);
  while (blob.size / 1024 > S.targetKB && q > 0.35) { q -= 0.08; blob = await keBlob(c, q); }
  let dataUrl = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });

  if (typeof ExifGps !== 'undefined' && posisiFoto() && posisiFoto().lat != null) {
    const rawCat = $('catatan').value.trim();
    dataUrl = ExifGps.sematkanKeDataUrl(dataUrl, {
      lat: posisiFoto().lat, lon: posisiFoto().lon, alt: posisiFoto().alt || 0, ts: Date.now(),
      deskripsi: rawCat || 'Dokumentasi dkpoint', kantor: S.kantor
    });
  }
  return { dataUrl, ukuran: Math.round(dataUrl.length * 0.75), w: W, h: H };
}

let sedangSimpan = false;
let timerDetik = 0, sedangHitung = false;
function jepret() {
  if (sedangSimpan || sedangHitung) return;
  if (!timerDetik) return jepretSekarang();
  sedangHitung = true;
  let n = timerDetik; const h = $('hitung');
  h.style.display = 'flex'; h.textContent = n; pesan('Foto dalam ' + n + ' detik');
  const t = setInterval(() => {
    n--;
    if (n <= 0) { clearInterval(t); h.style.display = 'none'; sedangHitung = false; jepretSekarang(); }
    else { h.textContent = n; pesan('Foto dalam ' + n + ' detik'); }
  }, 1000);
}
async function jepretSekarang() {
  if (KAMERA_ASLI) {
    if (sedangSimpan) return;
    sedangSimpan = true;
    $('rana').disabled = true;
    if (navigator.vibrate) navigator.vibrate(35);
    DokumentasiNative.jepretNative();
    return;
  }
  const v = $('video');
  if (!S.stream || !v.videoWidth) { pesan('Kamera belum siap, tunggu sebentar'); return; }
  if (sedangSimpan) return;
  sedangSimpan = true;
  $('rana').disabled = true;
  const tirai = $('tirai');
  tirai.classList.add('kilat'); setTimeout(() => tirai.classList.remove('kilat'), 180);
  if (navigator.vibrate) navigator.vibrate(35);
  try {
    const beku = potongKeRasio(v);
    const hasil = await prosesFoto(beku, beku.width, beku.height);
    await simpanDenganRekaman(hasil);
    $('catatan').value = '';
    pesan('Foto tersimpan'); muatMiniatur();
  } catch (err) {
    console.error('Gagal kamera cepat:', err);
    pesan('Gagal memproses foto: ' + err.message);
  } finally {
    sedangSimpan = false;
    $('rana').disabled = false;
  }
}

async function simpanDenganRekaman(hasil) {
  const ts = Date.now();
  const rawCatatan = $('catatan').value.trim();
  const catatan = (window.DK_SECURITY ? DK_SECURITY.bersihkanTeks(rawCatatan, 250) : rawCatatan) || '-';
  const namaRoom = (S.room || 'LOKAL').trim();
  const statusAwal = bisaUploadRoom(namaRoom) ? 'pending' : 'lokal';

  let latValid = null, lonValid = null, akurasiValid = null;
  if (posisiFoto() && posisiFoto().lat != null && (!window.DK_SECURITY || DK_SECURITY.validasiKoordinat(posisiFoto()))) {
    latValid = posisiFoto().lat; lonValid = posisiFoto().lon; akurasiValid = posisiFoto().akurasi;
  }

  const noUrut = (await hitungFotoRoom(namaRoom)) + 1;
  const noUrutStr = String(noUrut).padStart(3, '0');
  const kodeRoom = namaRoom.replace(/\s+/g, '_').replace(/[^\w-]/g, '').toUpperCase();
  const idUser = (S.userId || S.nama || 'USER').trim().replace(/\s+/g, '_').replace(/[^\w-]/g, '').toUpperCase();
  const koordStr = (latValid != null && lonValid != null) ? `_${latValid.toFixed(5)}_${lonValid.toFixed(5)}` : '';
  const namaBerkas = `${kodeRoom}_${idUser}_${noUrutStr}${koordStr}.jpg`;

  try {
    await simpanFoto({
      id: 'F' + ts, ts, nama: S.nama || 'Petugas', userId: idUser, noUrut, room: namaRoom, catatan,
      lat: latValid, lon: lonValid, akurasi: akurasiValid, namaBerkas,
      dataUrl: hasil.dataUrl, ukuran: hasil.ukuran, status: statusAwal,
      salinanHp: salinKeGaleriHp(namaBerkas, hasil.dataUrl)
    });
  } catch (err) {
    const penuh = /quota|storage|space/i.test(err.name + ' ' + err.message);
    pesan(penuh ? 'Penyimpanan HP penuh. Buka aplikasi, kirim foto antrean, lalu hapus foto lama.' : 'Foto gagal disimpan: ' + err.message);
    throw err;
  }
}

/* ---------- GPS & info ---------- */
function perbaruiInfo() {
  // Koordinat selalu tampil: GPS aktif, atau posisi terakhir yang tersimpan bila sinyal hilang.
  let teks = S.room || 'LOKAL';
  if (S.posisi) teks += ' · ' + fmtKoord(S.posisi) + ' · GPS terkunci';
  else if (posisiTerakhir) teks += ' · ' + fmtKoord(posisiTerakhir) + ' · GPS terakhir' + (galatGps ? ' (' + galatGps + ')' : '');
  else teks += ' · ' + (galatGps || 'GPS belum ada');
  $('info').textContent = teks;
}
let galatGps = '';
// Posisi terakhir disimpan di perangkat, dipakai untuk tampilan saat sinyal GPS hilang.
let posisiTerakhir = (() => {
  try { const v = JSON.parse(localStorage.getItem('posisi_terakhir') || 'null'); return v && v.lat != null ? v : null; }
  catch (_) { return null; }
})();
// Koordinat untuk watermark & metadata: GPS aktif, atau posisi terakhir bila sinyal belum ada.
function posisiFoto() {
  return S.posisi || posisiTerakhir || null;
}
// Lokasi dari aplikasi (native) dipakai bila ada; WebView tidak dipakai agar tidak menimpa data.
function terimaLokasiNative(lat, lon, akurasi, segar) {
  galatGps = '';
  if (segar) {
    S.posisi = { lat: lat, lon: lon, alt: null, akurasi: akurasi };
    posisiTerakhir = { lat: lat, lon: lon, t: Date.now() };
  } else {
    S.posisi = null;
    posisiTerakhir = { lat: lat, lon: lon, t: Date.now() };
  }
  try { localStorage.setItem('posisi_terakhir', JSON.stringify(posisiTerakhir)); } catch (_) {}
  perbaruiInfo();
}
function terimaGalatLokasi(teks) {
  galatGps = teks;
  S.posisi = null;
  perbaruiInfo();
}
function mulaiGps() {
  if (KAMERA_ASLI) return;
  if (!navigator.geolocation) { galatGps = 'lokasi tidak didukung'; perbaruiInfo(); return; }
  navigator.geolocation.watchPosition(p => {
    galatGps = '';
    S.posisi = { lat: p.coords.latitude, lon: p.coords.longitude, alt: p.coords.altitude, akurasi: p.coords.accuracy };
    posisiTerakhir = { lat: S.posisi.lat, lon: S.posisi.lon, t: Date.now() };
    try { localStorage.setItem('posisi_terakhir', JSON.stringify(posisiTerakhir)); } catch (_) {}
    perbaruiInfo();
  }, (err) => {
    S.posisi = null;
    galatGps = err && err.code === 1 ? 'izin lokasi ditolak' : (err && err.code === 2 ? 'sinyal GPS tidak tersedia' : 'GPS belum terkunci');
    perbaruiInfo();
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
}

/* ---------- Jembatan kamera asli (APK) ---------- */
function kirimPosisiPratinjau() {
  if (!KAMERA_ASLI) return;
  const el = document.querySelector('.pratinjau');
  if (!el) return;
  const r = el.getBoundingClientRect();
  try { DokumentasiNative.aturPratinjau(Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)); } catch (_) {}
}
window.addEventListener('resize', kirimPosisiPratinjau);
function terimaFotoNative(dataUrl) {
  const img = new Image();
  img.onload = async () => {
    try {
      const hasil = await prosesFoto(img, img.naturalWidth, img.naturalHeight);
      await simpanDenganRekaman(hasil);
      $('catatan').value = '';
      pesan('Foto tersimpan'); muatMiniatur();
    } catch (err) {
      pesan('Gagal memproses foto: ' + err.message);
    } finally {
      sedangSimpan = false;
      $('rana').disabled = false;
    }
  };
  img.onerror = () => { sedangSimpan = false; $('rana').disabled = false; pesan('Foto tidak bisa dibaca'); };
  img.src = dataUrl;
}
function terimaGagalNative(teks) {
  sedangSimpan = false;
  $('rana').disabled = false;
  pesan(teks);
}

/* ---------- Foto terakhir (miniatur) ---------- */
async function muatMiniatur() {
  try {
    const d = await bukaDB();
    const req = d.transaction(STORE, 'readonly').objectStore(STORE).openCursor(null, 'prev');
    req.onsuccess = () => {
      const c = req.result;
      if (c && c.value && c.value.dataUrl) $('mini').style.backgroundImage = 'url("' + c.value.dataUrl + '")';
    };
  } catch (_) {}
}
$('mini').onclick = () => pesan('Foto terakhir. Lihat semua di Galeri aplikasi');

/* ---------- Panel pengaturan cepat ---------- */
function tandaiOpsi(grup, nilai) {
  grup.querySelectorAll('button').forEach(b => b.classList.toggle('pilih', b.dataset.v === String(nilai)));
}
$('panelBtn').onclick = () => {
  const buka = !$('panel').classList.contains('buka');
  $('panel').classList.toggle('buka', buka);
  $('panelBtn').setAttribute('aria-expanded', buka);
  setTimeout(kirimPosisiPratinjau, 60);
  setTimeout(kirimPosisiPratinjau, 300);
};
$('opsiTimer').onclick = e => { const b = e.target.closest('button'); if (!b) return; timerDetik = +b.dataset.v; tandaiOpsi($('opsiTimer'), timerDetik); };
$('opsiMutu').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  S.targetKB = +b.dataset.v; tandaiOpsi($('opsiMutu'), S.targetKB);
  try { localStorage.setItem('bpkh_target', String(S.targetKB)); } catch (_) {}
};
$('ganti').onclick = () => {
  if (!(window.DokumentasiNative && DokumentasiNative.gantiKamera)) { pesan('Ganti kamera hanya tersedia di aplikasi'); return; }
  try { const depan = DokumentasiNative.gantiKamera(); pesan(depan ? 'Kamera depan' : 'Kamera belakang'); } catch (_) {}
};

/* ---------- Tutup ---------- */
function tutupKamera() {
  hentikanKamera();
  try {
    if (window.DokumentasiNative && DokumentasiNative.tutup) { DokumentasiNative.tutup(); return; }
  } catch (_) {}
}

$('rana').onclick = jepret;
$('tutup').onclick = tutupKamera;
$('cobaLagi').onclick = () => { bukaKamera.sudahUlang = false; bukaKamera(); };

muatPengaturan();
tandaiOpsi($('opsiMutu'), S.targetKB);
muatMiniatur();
perbaruiInfo();
mulaiGps();
bukaKamera();
setTimeout(kirimPosisiPratinjau, 400);
/* ---------- Catatan dengan suara (mikrofon, Bahasa Indonesia) ---------- */
let suaraAwal = '';
let suaraTimer = null;
function batalSuaraTimer() { if (suaraTimer) { clearTimeout(suaraTimer); suaraTimer = null; } }
$('mikrofon').onclick = () => {
  if (!(window.DokumentasiNative && DokumentasiNative.mulaiSuara)) { pesan('Catatan suara hanya tersedia di aplikasi'); return; }
  if ($('mikrofon').classList.contains('aktif')) { try { DokumentasiNative.hentikanSuara(); } catch (_) {} return; }
  suaraAwal = $('catatan').value;
  pesan('Memulai mikrofon…');
  batalSuaraTimer();
  suaraTimer = setTimeout(() => suaraGagal('Mikrofon tidak merespons. Cek izin Mikrofon DKPoint di Pengaturan dan pastikan aplikasi Google aktif.'), 8000);
  try { DokumentasiNative.mulaiSuara(); } catch (_) { suaraGagal('Catatan suara tidak bisa dimulai'); }
};
function suaraMulai() { batalSuaraTimer(); $('mikrofon').classList.add('aktif'); pesan('Silakan bicara...'); }
function suaraSelesai() { batalSuaraTimer(); $('mikrofon').classList.remove('aktif'); }
function suaraGagal(teks) { suaraSelesai(); pesan(teks); }
function terimaSuara(teks, akhir) {
  batalSuaraTimer();
  const c = $('catatan');
  c.value = ((suaraAwal ? suaraAwal + ' ' : '') + teks).slice(0, 250);
  if (akhir) { suaraAwal = c.value; suaraSelesai(); }
}

if (KAMERA_ASLI) {
  /* Kolom catatan: minta jendela menerima fokus supaya keyboard muncul. */
  $('catatan').addEventListener('focus', () => {
    try { DokumentasiNative.fokusKetik(true); } catch (_) {}
    setTimeout(() => $('catatan').focus(), 150);
  });
  $('catatan').addEventListener('blur', () => {
    try { DokumentasiNative.fokusKetik(false); } catch (_) {}
  });
}
setTimeout(kirimPosisiPratinjau, 1200);
</script>
